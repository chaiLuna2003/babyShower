<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmaciones</title>
    <link rel="icon" href="baby-solid.svg" type="image/x-icon" />
    <link rel="stylesheet" href="confirmaciones.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="element-one">
      <section class="encabezado"></section>

      <div class="tabla-container">
        <div class="content-encabezado">
          <h1>Tabla de confirmaciones</h1>
        </div>

        <div class="filtros" style="text-align: center; margin-bottom: 1rem">
          <button class="filtro-btn" data-familia="todas">Todas</button>
          <button class="filtro-btn" data-familia="paterna">Paterna</button>
          <button class="filtro-btn" data-familia="materna">Materna</button>
        </div>
        <div style="text-align: center; margin-bottom: 1rem">
          <input
            type="text"
            id="busquedaNombre"
            placeholder="Buscar por nombre..."
            class="border rounded p-2 w-60"
          />
        </div>
        <table id="tablaConfirmaciones">
          <thead>
            <tr>
              <th>#</th>
              <th>Familia</th>
              <th>Nombre(s)</th>
              <th>Mensaje</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody></tbody>
          <div id="contadorConfirmaciones" class="contador"></div>
          <div
            id="paginacion"
            class="paginacion"
            style="text-align: center; margin-top: 1rem"
          ></div>
        </table>
      </div>
      <div class="grafica">
        <h2>Resultados de votaciones</h2>
        <canvas id="graficaVotos" width="350" height="350"></canvas>
        <div class="voto-resumen">
          <p><strong>Total de votos:</strong> <span id="totalVotos">0</span></p>
          <p><strong>Votos para Niño:</strong> <span id="totalNino">0</span></p>
          <p><strong>Votos para Niña:</strong> <span id="totalNina">0</span></p>
        </div>
        <div id="mensajeGanador" class="mensaje-ganador"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD-6dbDS0AqUA3D09ciOFqdr9rUdoW21oI",
        authDomain: "babyshowergam.firebaseapp.com",
        projectId: "babyshowergam",
        storageBucket: "babyshowergam.firebasestorage.app",
        messagingSenderId: "703529239996",
        appId: "1:703529239996:web:e305fd186149868aac57b9",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const tablaBody = document.querySelector("#tablaConfirmaciones tbody");
      const inputBusqueda = document.querySelector("#busquedaNombre");

      let datosConfirmaciones = [];

      // Variables para estado activo
      let filtroActivo = "todas";
      let textoBusqueda = "";

      async function cargarConfirmaciones() {
        tablaBody.innerHTML = "";
        datosConfirmaciones = [];

        try {
          const querySnapshot = await getDocs(collection(db, "confirmaciones"));
          querySnapshot.forEach((doc) => {
            datosConfirmaciones.push(doc.data());
          });

          renderizarTabla();
        } catch (error) {
          console.error("Error cargando Firestore:", error);
          alert("No se pudieron cargar las confirmaciones 😓");
        }
      }

      const porPagina = 10;
      let paginaActual = 1;

      function renderizarTabla() {
        tablaBody.innerHTML = "";

        const datosFiltrados = datosConfirmaciones
          .filter((d) => filtroActivo === "todas" || d.familia === filtroActivo)
          .filter((d) =>
            d.nombre.toLowerCase().includes(textoBusqueda.toLowerCase())
          );

        const totalPaginas = Math.ceil(datosFiltrados.length / porPagina);
        const inicio = (paginaActual - 1) * porPagina;
        const fin = inicio + porPagina;
        const datosPaginados = datosFiltrados.slice(inicio, fin);

        let index = inicio + 1;
        datosPaginados.forEach((data) => {
          const fecha = new Date(data.fecha).toLocaleString("es-MX", {
            dateStyle: "short",
            timeStyle: "short",
          });

          const fila = document.createElement("tr");
          fila.innerHTML = `
        <td>${index++}</td>
        <td>${data.familia}</td>
        <td>${data.nombre}</td>
        <td>${data.mensaje || ""}</td>
        <td>${fecha}</td>
      `;
          tablaBody.appendChild(fila);
        });

        // Contador
        document.getElementById(
          "contadorConfirmaciones"
        ).textContent = `Total de confirmaciones: ${datosFiltrados.length}`;

        // Paginación
        renderizarPaginacion(totalPaginas);
      }

      function renderizarPaginacion(totalPaginas) {
        const contenedor = document.getElementById("paginacion");
        contenedor.innerHTML = "";

        if (totalPaginas <= 1) return; // No mostrar si hay solo una página

        // Botón Anterior
        const btnAnterior = document.createElement("button");
        btnAnterior.textContent = "Anterior";
        btnAnterior.disabled = paginaActual === 1;
        btnAnterior.onclick = () => {
          paginaActual--;
          renderizarTabla();
        };
        contenedor.appendChild(btnAnterior);

        // Números de página
        for (let i = 1; i <= totalPaginas; i++) {
          const btnPagina = document.createElement("button");
          btnPagina.textContent = i;
          if (i === paginaActual) btnPagina.classList.add("active");
          btnPagina.onclick = () => {
            paginaActual = i;
            renderizarTabla();
          };
          contenedor.appendChild(btnPagina);
        }

        // Botón Siguiente
        const btnSiguiente = document.createElement("button");
        btnSiguiente.textContent = "Siguiente";
        btnSiguiente.disabled = paginaActual === totalPaginas;
        btnSiguiente.onclick = () => {
          paginaActual++;
          renderizarTabla();
        };
        contenedor.appendChild(btnSiguiente);
      }

      // Listener filtro botones
      document.querySelectorAll(".filtro-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          document
            .querySelectorAll(".filtro-btn")
            .forEach((b) => b.classList.remove("active"));
          e.target.classList.add("active");
          filtroActivo = e.target.dataset.familia;
          renderizarTabla();
        });
      });

      // Listener búsqueda
      inputBusqueda.addEventListener("input", (e) => {
        textoBusqueda = e.target.value;
        renderizarTabla();
      });
      async function cargarVotosYGraficar() {
        try {
          const querySnapshot = await getDocs(collection(db, "votaciones"));

          let conteoNiño = 0;
          let conteoNiña = 0;

          querySnapshot.forEach((doc) => {
            const voto = doc.data().voto;
            if (voto === "Niño") conteoNiño++;
            if (voto === "Niña") conteoNiña++;
          });

          const total = conteoNiño + conteoNiña;

          document.getElementById("totalVotos").textContent = total;
          document.getElementById("totalNino").textContent = conteoNiño;
          document.getElementById("totalNina").textContent = conteoNiña;

          const mensajeEl = document.getElementById("mensajeGanador");

          if (conteoNiño > conteoNiña) {
            mensajeEl.textContent = "🎉 ¡Va ganando Niño! 👦";
            lanzarConfeti();
          } else if (conteoNiña > conteoNiño) {
            mensajeEl.textContent = "🎉 ¡Va ganando Niña! 👧";
            lanzarConfeti();
          } else if (total > 0) {
            mensajeEl.textContent = "🤝 ¡Tenemos un empate!";
          } else {
            mensajeEl.textContent = "";
          }

          const ctx = document.getElementById("graficaVotos").getContext("2d");

          new Chart(ctx, {
            type: "doughnut",
            data: {
              labels: ["Niño", "Niña"],
              datasets: [
                {
                  data: [conteoNiño, conteoNiña],
                  backgroundColor: ["#D1E9F6", "#F3D0D7"],
                  borderColor: ["#295F98", "#C53030"],
                  borderWidth: 3,
                },
              ],
            },
            options: {
              responsive: true,
              cutout: "60%",
              plugins: {
                legend: {
                  position: "bottom",
                  labels: {
                    font: {
                      size: 14,
                    },
                    color: "#333",
                  },
                },
                tooltip: {
                  callbacks: {
                    label: (ctx) => {
                      const label = ctx.label || "";
                      const value = ctx.raw || 0;
                      const percentage = ((value / total) * 100).toFixed(1);
                      return `${label}: ${value} voto(s) (${percentage}%)`;
                    },
                  },
                },
              },
            },
          });
        } catch (error) {
          console.error("Error al cargar votos:", error);
          alert("No se pudo cargar la gráfica de votos 😢");
        }
      }

      function lanzarConfeti() {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 },
        });
      }

      cargarVotosYGraficar();
      cargarConfirmaciones();
    </script>
  </body>
</html>
